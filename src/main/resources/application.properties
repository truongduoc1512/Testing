# ===============================
# JPA / HIBERNATE
# ===============================
 
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# Tắt tính năng tự động chạy Flyway khi phát triển
spring.flyway.enabled=false
# (Tùy chọn) Cho phép Flyway dọn dẹp DB nếu có lỗi cấu trúc - Không dùng trên Production
spring.flyway.clean-disabled=false

# ===============================
# AI MICROSERVICE
# ===============================
# URL của AI Python FastAPI service (override bằng env var AI_SERVICE_URL trong Docker)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ===============================
# GOOGLE OAUTH2 LOGIN
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# ===============================
# SPRINGDOC OPENAPI / SWAGGER UI
# ===============================
springdoc.packages-to-scan=com.example.demo.controller
springdoc.paths-to-match=/**
springdoc.show-actuator=true
springdoc.override-with-generic-response=true
springdoc.show-login-endpoint=true