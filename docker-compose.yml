version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL (Tối ưu RAM siêu nhẹ cho máy 12GB)
  shoeshop-mysql:
    image: mysql:8.0
    container_name: shoeshop-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}
      MYSQL_DATABASE: shoe_shopdb
    ports:
      - "3307:3306"
    command: >
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci 
      --innodb_buffer_pool_size=128M 
      --max_connections=50 
      --performance_schema=OFF
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoeshop-net

  # 2. Khối AI Microservice (Python FastAPI + YOLOv8)
  ai-service:
    image: shoeshop-ai:${APP_VERSION:-latest}
    build: 
      context: ./ai-service
    container_name: shoeshop-ai
    restart: always
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - shoeshop-net

  # 3. Ứng dụng Backend (Java Spring Boot - Tối ưu JVM RAM)
  shoeshop-backend:
    image: shoeshop-backend:${APP_VERSION:-latest}
    build: .
    container_name: shoeshop-api
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://shoeshop-mysql:3306/shoe_shopdb?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - shoeshop-net
    depends_on:
      shoeshop-mysql:
        condition: service_healthy
      ai-service:
        condition: service_started

  # 4. Nginx Proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: shoeshop-nginx
    restart: always
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - shoeshop-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shoeshop-net

  # 5. Giao diện phpMyAdmin trên Web
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shoeshop-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: shoeshop-mysql
      PMA_ARBITRARY: 1
      PMA_ABSOLUTE_URI: http://localhost:8081/
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - shoeshop-mysql
    networks:
      - shoeshop-net

  # 6. Giao diện Swagger UI
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: shoeshop-swagger
    restart: always
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON_URL: http://localhost/v3/api-docs
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - shoeshop-backend
    networks:
      - shoeshop-net

networks:
  shoeshop-net:
    driver: bridge