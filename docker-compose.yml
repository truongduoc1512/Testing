version: '3.8'

services:
  # 1. Ứng dụng Backend
  shoeshop-backend:
    build: .
    container_name: shoeshop-api
    restart: always
    environment:
      # TRỎ THẲNG LÊN MÁY CHỦ AWS RDS
      - SPRING_DATASOURCE_URL=jdbc:mysql://shoeshop-rds.c7eiik2uandc.ap-southeast-2.rds.amazonaws.com:3306/shoeshop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=0949096416!
    networks:
      - shoeshop-net

  # 2. Nginx
  nginx-proxy:
    image: nginx:alpine
    container_name: shoeshop-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - shoeshop-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shoeshop-net

networks:
  shoeshop-net:
    driver: bridge